spring:
  datasource:
    url: jdbc:postgresql://${USERDB_CONTAINER_NAME}:${POSTGRESDB_DOCKER_PORT}/${POSTGRESDB_USER_NAME}
    username: ${POSTGRESDB_USER}
    password: ${POSTGRESDB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate.ddlAuto: update
    database: postgresql
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${USER_SERVER_PORT}

eureka:
  instance:
    hostname: ${USER_SERVICE_CONTAINER_NAME}
  client:
    registerWithEureka: true
    fetchRegistry: true

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/user/v3/api-docs
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    path: /api/v1/user/swagger-ui.html

app:
  keycloak:
    admin:
      clientId: admin-cli
      clientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    realm: microbook
    serverUrl: http://${KEYCLOAK_HOST_NAME}:8080