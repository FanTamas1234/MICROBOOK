spring:
  datasource:
    url: jdbc:postgresql://${BOOKDB_CONTAINER_NAME}:${POSTGRESDB_DOCKER_PORT}/${POSTGRESDB_BOOK_NAME}
    username: ${POSTGRESDB_USER}
    password: ${POSTGRESDB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate.ddlAuto: update
    database: postgresql
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrapServers: kafka:9092
    producer:
      keySerializer: org.apache.kafka.common.serialization.StringSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: tradeResponseDto:com.booking.book.bookservice.dto.ExchangeTradeResponseDto
    consumer:
      groupId: book-group
      autoOffsetReset: earliest
      keyDeserializer: org.apache.kafka.common.serialization.StringDeserializer
      #      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      valueDeserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      #      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        #        spring:
        #          deserializer:#            value:
        #              delegate:#                class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json:
          trusted.packages: '*'
          type.mapping: tradeInfoRequest:com.booking.book.bookservice.dto.ExchangeTradeRequestDto

server:
  port: ${BOOK_SERVER_PORT}

eureka:
  instance:
    hostname: ${BOOK_SERVICE_CONTAINER_NAME}
  client:
    registerWithEureka: true
    fetchRegistry: true

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/books/v3/api-docs
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    path: /api/v1/books/swagger-ui.html